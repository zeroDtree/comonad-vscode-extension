name: Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # 手动跑：只测试 + 打包 + 上传 artifact，不发布

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a npm test

  publish:
    name: Package and publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # 创建 GitHub Release
      id-token: write   # 换取 Marketplace 的 OIDC 凭证
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Package VSIX
        # 触发 vscode:prepublish -> npm run package（check-types + lint + esbuild --production）
        run: npx --yes @vscode/vsce@4.1.1 package --out comonad.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: comonad-vsix
          path: comonad.vsix
          if-no-files-found: error

      - name: Publish to Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --skip-duplicate --packagePath comonad.vsix

      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: comonad.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true
